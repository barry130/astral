# ============================================================================
# CNB 云原生构建：自动构建后端 / 前端镜像并推送到 CNB 自带 Docker 制品库
# （docker.cnb.cool，随代码仓库托管，不再单独推腾讯云 TCR）
#
# 取代原 GitHub Actions（.github/workflows/docker-publish.yml，已删除）：
#   - 构建机在国内（腾讯云），push 到 master 自动触发，按改动路径过滤（后端/前端互不连坐）
#   - 分支详情页按钮手动触发（.cnb/web_trigger.yml）＝ 后端+前端全量重建
#   - tag 规则不变：latest + 日期-短SHA（如 20261001-1a2b3c4d，后者用于回滚）
#   - 服务器侧（deploy/update.sh、docker-compose.registry.yml）结构不变，
#     仅 deploy/.env 的 REGISTRY 换成 docker.cnb.cool/canace/astral
#
# 推送免登录：services: docker 会自动 docker login 到 CNB 制品库，
# 凭证即流水线触发者的访问令牌，无需 imports 密钥仓库（原 TCR 凭证管道已删）。
#
# 服务器拉取：astral 是私有仓，镜像随之私有——服务器需登录一次：
#   echo '<CNB访问令牌>' | docker login docker.cnb.cool -u cnb --password-stdin
#   令牌需勾选 registry-package 读权限（详见 DEPLOY_GUIDE.md）。
#
# 一次性配置（详见 DEPLOY_GUIDE.md「CI 构建 + 服务器 pull 更新」）：
#   ① CNB 注册并创建同名仓库 astral，本仓库推送上去
#   ② CNB 仓库设置勾选「允许自动触发」（否则 push 不触发构建）
# ============================================================================

# ---- 可复用片段（YAML 锚点；`.` 开头的顶层键不会当作分支配置执行） ----

# services: docker = 挂载 dind（并自动登录 docker.cnb.cool），脚本里直接 build / push
# runner 显式降配：默认 8 核(16G)对这个项目的构建是浪费——计费按「核数 × 耗时」算核时，
# 4 核(8G) 跑 Maven / Next 构建足够（GHA ubuntu-latest 也才 4 核），核时消耗直接减半。
# 钉死 amd64 与服务器架构一致；仓库无 LFS / 子模块，关掉省拉取开销。
.docker-pipeline: &docker-pipeline
  runner:
    tags: cnb:arch:amd64
    cpus: 4
  git:
    lfs: false
    submodules: false
  services:
    - docker
  env:
    IMAGE_PREFIX: docker.cnb.cool/canace/astral

.backend-stages: &backend-stages
  - name: 生成发布 tag（日期-短SHA，兼作回滚锚点）
    script: echo -n "$IMAGE_PREFIX/astral-backend:$(date -u +%Y%m%d)-$CNB_COMMIT_SHORT"
    exports:
      info: IMAGE_URL
  - name: docker build（后端，上下文=仓库根）
    script: docker build -f astral-server/Dockerfile -t "$IMAGE_URL" -t "$IMAGE_PREFIX/astral-backend:latest" .
  - name: docker push（双 tag；第二个 tag 复用刚上传的层，几乎零开销）
    script: |
      docker push "$IMAGE_URL"
      docker push "$IMAGE_PREFIX/astral-backend:latest"

.frontend-stages: &frontend-stages
  - name: 生成发布 tag（日期-短SHA，兼作回滚锚点）
    script: echo -n "$IMAGE_PREFIX/astral-frontend:$(date -u +%Y%m%d)-$CNB_COMMIT_SHORT"
    exports:
      info: IMAGE_URL
  - name: docker build（前端，上下文=astral-front）
    script: >-
      docker build -f astral-front/Dockerfile
      --build-arg NEXT_PUBLIC_API_URL=https://astral.canace.cn
      -t "$IMAGE_URL" -t "$IMAGE_PREFIX/astral-frontend:latest" astral-front
  - name: docker push（双 tag；第二个 tag 复用刚上传的层，几乎零开销）
    script: |
      docker push "$IMAGE_URL"
      docker push "$IMAGE_PREFIX/astral-frontend:latest"

# ---- 构建配置 ----
master:
  push:
    # ifNewBranch: 首次把 master 推上 CNB 时属于新分支，ifModify 没有比对基准，
    # 用它保证首次推送必定全量构建；之后每次 push 走 ifModify 路径过滤。
    - name: backend 镜像
      <<: *docker-pipeline
      lock:
        key: backend-image
        cancel-in-progress: true
      ifNewBranch: true
      ifModify:
        - pom.xml
        - .mvn/**
        - astral-common/**
        - astral-schema/**
        - astral-dao/**
        - astral-log/**
        - astral-auth/**
        - astral-system/**
        - astral-monitor/**
        - astral-sequence/**
        - astral-plugin-api/**
        - astral-plugin/**
        - astral-server/**
        - .cnb.yml
      stages: *backend-stages

    - name: frontend 镜像
      <<: *docker-pipeline
      lock:
        key: frontend-image
        cancel-in-progress: true
      ifNewBranch: true
      ifModify:
        - astral-front/**
        - .cnb.yml
      stages: *frontend-stages

  # 手动触发（master 分支详情页按钮，见 .cnb/web_trigger.yml）：
  # 全量重建，不做路径过滤。web_trigger 事件没有文件变更基准，
  # ifModify 在该事件下本来就不生效，这里干脆不写。
  web_trigger_publish:
    - name: backend 镜像（手动全量）
      <<: *docker-pipeline
      lock:
        key: backend-image
        cancel-in-progress: true
      stages: *backend-stages

    - name: frontend 镜像（手动全量）
      <<: *docker-pipeline
      lock:
        key: frontend-image
        cancel-in-progress: true
      stages: *frontend-stages
