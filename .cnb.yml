# ============================================================================
# CNB 云原生构建：自动构建后端 / 前端 / 博客镜像并推送到 CNB 自带 Docker 制品库
# （docker.cnb.cool，随代码仓库托管，不再单独推腾讯云 TCR）
#
# 取代原 GitHub Actions（.github/workflows/docker-publish.yml，已删除）：
#   - 构建机在国内（腾讯云），push 到 master 自动触发，完整构建三个服务，保证固定 tag 可部署
#   - 分支详情页按钮手动触发（.cnb/web_trigger.yml）＝ 后端+前端+博客全量重建
#   - tag 规则不变：latest + 日期-短SHA（如 20261001-1a2b3c4d，后者用于回滚）
#   - 服务器侧（deploy/update.sh、docker-compose.registry.yml）结构不变，
#     仅 deploy/.env 的 REGISTRY 换成 docker.cnb.cool/canace/astral
#
# 推送免登录：services: docker 会自动 docker login 到 CNB 制品库，
# 凭证即流水线触发者的访问令牌，无需 imports 密钥仓库（原 TCR 凭证管道已删）。
#
# 服务器拉取：astral 是私有仓，镜像随之私有——服务器需登录一次：
#   echo '<CNB访问令牌>' | docker login docker.cnb.cool -u cnb --password-stdin
#   令牌需勾选 registry-package 读权限（详见 DEPLOY_GUIDE.md）。
#
# 一次性配置（详见 DEPLOY_GUIDE.md「CI 构建 + 服务器 pull 更新」）：
#   ① CNB 注册并创建同名仓库 astral，本仓库推送上去
#   ② CNB 仓库设置勾选「允许自动触发」（否则 push 不触发构建）
# ============================================================================

# ---- 可复用片段（YAML 锚点；`.` 开头的顶层键不会当作分支配置执行） ----

# services: docker = 挂载 dind（并自动登录 docker.cnb.cool），脚本里直接 build / push
# runner 显式降配：默认 8 核(16G)对这个项目的构建是浪费——计费按「核数 × 耗时」算核时，
# 4 核(8G) 跑 Maven / Next 构建足够（GHA ubuntu-latest 也才 4 核），核时消耗直接减半。
# 钉死 amd64 与服务器架构一致；仓库无 LFS / 子模块，关掉省拉取开销。
.docker-pipeline: &docker-pipeline
  runner:
    tags: cnb:arch:amd64
    cpus: 4
  git:
    lfs: false
    submodules: false
  services:
    - docker
  env:
    IMAGE_PREFIX: docker.cnb.cool/canace/astral

# All services share the immutable release tag consumed by docker-compose.registry.yml.
# Configure BLOG_SITE_URL and BLOG_ADMIN_URL in CNB project environment variables.
.release-pipeline: &release-pipeline
  <<: *docker-pipeline
  name: 完整版本镜像
  lock:
    key: astral-release
    cancel-in-progress: false
  stages:
    - name: 生成共同发布 tag
      script: echo -n "$(date -u +%Y%m%d)-$CNB_COMMIT_SHORT"
      exports:
        info: RELEASE_TAG
    - name: 构建并发布后端、前端和博客
      script: bash scripts/build-release.sh
# ---- 开源组件漏洞扫描 ----
# 为什么要它：2026-10 那批 CVE 是拿版本号人工翻漏洞库才发现的。没有扫描，
# 下一个 CVE 公布还是得靠人想起来。
#
# 用平台官方插件 cnbcool/sca-vulnerability 而不是自研脚本（官方 T0：
# docs.cnb.cool/zh/security/sca-vulnerability.md）：它直接解析 Maven/npm
# 锁定的依赖清单，省掉「mvn 实解依赖树 + 自己查 OSV」那一层易错胶水，
# 且自带增量规则（同一组件同一 CVE 不重复阻断）与 XLSX 报告。
#
# 为什么**不**配 failOnSeverity（＝不设门禁）：
# 镜像发布链路上卡一个第三方 CVE，等于用漏洞换可用性 —— 紧急修复会被自己堵死。
# 所以扫描失败也照常发镜像，只在日志里列出全部漏洞，由人（或 NPC）当天跟进。
# 要转成强门禁：加一行 failOnSeverity: high 即可（须同时接上「当天修完」的值班承诺）。
#
# 触发条件：只在依赖指纹变更时跑，避免改文档也扫一遍。
.sca-vuln: &sca-vuln
  name: 开源组件漏洞扫描
  runner:
    tags: cnb:arch:amd64
    cpus: 2
  git:
    lfs: false
    submodules: false
  allowFailure: true
  stages:
    - name: 扫描（全量）
      image: cnbcool/sca-vulnerability:latest
      timeout: 20m
      settings:
        scanMode: full
        publish: true

# Every deployable push publishes all three images under one tag.
master:
  push:
    - <<: *sca-vuln
      ifModify:
        - pom.xml
        - '**/pom.xml'
        - astral-front/package.json
        - astral-front/package-lock.json
        - astral-blog/package.json
        - astral-blog/pnpm-lock.yaml
        - .cnb.yml
    - <<: *release-pipeline
  web_trigger_publish:
    - <<: *release-pipeline
