# ============================================================================
# CNB 云原生构建：自动构建后端 / 前端 / 博客镜像并推送到 CNB 自带 Docker 制品库
# （docker.cnb.cool，随代码仓库托管，不再单独推腾讯云 TCR）
#
# 取代原 GitHub Actions（.github/workflows/docker-publish.yml，已删除）：
#   - 构建机在国内（腾讯云），push 到 master 自动触发，按改动路径过滤（后端/前端互不连坐）
#   - 分支详情页按钮手动触发（.cnb/web_trigger.yml）＝ 后端+前端全量重建
#   - tag 规则不变：latest + 日期-短SHA（如 20261001-1a2b3c4d，后者用于回滚）
#   - 服务器侧（deploy/update.sh、docker-compose.registry.yml）结构不变，
#     仅 deploy/.env 的 REGISTRY 换成 docker.cnb.cool/canace/astral
#
# 推送免登录：services: docker 会自动 docker login 到 CNB 制品库，
# 凭证即流水线触发者的访问令牌，无需 imports 密钥仓库（原 TCR 凭证管道已删）。
#
# 服务器拉取：astral 是私有仓，镜像随之私有——服务器需登录一次：
#   echo '<CNB访问令牌>' | docker login docker.cnb.cool -u cnb --password-stdin
#   令牌需勾选 registry-package 读权限（详见 DEPLOY_GUIDE.md）。
#
# 一次性配置（详见 DEPLOY_GUIDE.md「CI 构建 + 服务器 pull 更新」）：
#   ① CNB 注册并创建同名仓库 astral，本仓库推送上去
#   ② CNB 仓库设置勾选「允许自动触发」（否则 push 不触发构建）
# ============================================================================

# ---- 可复用片段（YAML 锚点；`.` 开头的顶层键不会当作分支配置执行） ----

# services: docker = 挂载 dind（并自动登录 docker.cnb.cool），脚本里直接 build / push
# runner 显式降配：默认 8 核(16G)对这个项目的构建是浪费——计费按「核数 × 耗时」算核时，
# 4 核(8G) 跑 Maven / Next 构建足够（GHA ubuntu-latest 也才 4 核），核时消耗直接减半。
# 钉死 amd64 与服务器架构一致；仓库无 LFS / 子模块，关掉省拉取开销。
.docker-pipeline: &docker-pipeline
  runner:
    tags: cnb:arch:amd64
    cpus: 4
  git:
    lfs: false
    submodules: false
  services:
    - docker
  env:
    IMAGE_PREFIX: docker.cnb.cool/canace/astral

.backend-stages: &backend-stages
  - name: 生成发布 tag（日期-短SHA，兼作回滚锚点）
    script: echo -n "$IMAGE_PREFIX/astral-backend:$(date -u +%Y%m%d)-$CNB_COMMIT_SHORT"
    exports:
      info: IMAGE_URL
  - name: docker build（后端，上下文=仓库根）
    script: docker build -f astral-server/Dockerfile -t "$IMAGE_URL" -t "$IMAGE_PREFIX/astral-backend:latest" .
  - name: docker push（双 tag；第二个 tag 复用刚上传的层，几乎零开销）
    script: |
      docker push "$IMAGE_URL"
      docker push "$IMAGE_PREFIX/astral-backend:latest"

.frontend-stages: &frontend-stages
  - name: 生成发布 tag（日期-短SHA，兼作回滚锚点）
    script: echo -n "$IMAGE_PREFIX/astral-frontend:$(date -u +%Y%m%d)-$CNB_COMMIT_SHORT"
    exports:
      info: IMAGE_URL
  - name: docker build（前端，上下文=astral-front）
    # 不再传 NEXT_PUBLIC_API_URL：同源形态（空串）烤进 bundle，镜像与后端域名解耦，
    # /api 由容器内 proxy.js 按启动时 BACKEND_URL 转发，换后端不重打包
    script: >-
      docker build -f astral-front/Dockerfile
      -t "$IMAGE_URL" -t "$IMAGE_PREFIX/astral-frontend:latest" astral-front
  - name: docker push（双 tag；第二个 tag 复用刚上传的层，几乎零开销）
    script: |
      docker push "$IMAGE_URL"
      docker push "$IMAGE_PREFIX/astral-frontend:latest"

# 博客前台（astral-blog）：独立发布站点，构建上下文=astral-blog。
# 它不需要 NEXT_PUBLIC_API_URL——所有后端请求都在服务端完成，
# 运行期由 CMS_API_BASE 决定（compose 里固定 http://backend:27000），
# 所以镜像本身与域名无关，换域名不用重新构建（前端镜像同源化改造后也是这一形态）。
.blog-stages: &blog-stages
  - name: 生成发布 tag（日期-短SHA，兼作回滚锚点）
    script: echo -n "$IMAGE_PREFIX/astral-blog:$(date -u +%Y%m%d)-$CNB_COMMIT_SHORT"
    exports:
      info: IMAGE_URL
  - name: docker build（博客，上下文=astral-blog）
    script: >-
      docker build -f astral-blog/Dockerfile
      --build-arg CMS_API_BASE=http://backend:27000
      -t "$IMAGE_URL" -t "$IMAGE_PREFIX/astral-blog:latest" astral-blog
  - name: docker push（双 tag；第二个 tag 复用刚上传的层，几乎零开销）
    script: |
      docker push "$IMAGE_URL"
      docker push "$IMAGE_PREFIX/astral-blog:latest"

# ---- 开源组件漏洞扫描 ----
# 为什么要它：2026-10 那批 CVE 是拿版本号人工翻漏洞库才发现的。没有扫描，
# 下一个 CVE 公布还是得靠人想起来。
#
# 用平台官方插件 cnbcool/sca-vulnerability 而不是自研脚本（官方 T0：
# docs.cnb.cool/zh/security/sca-vulnerability.md）：它直接解析 Maven/npm
# 锁定的依赖清单，省掉「mvn 实解依赖树 + 自己查 OSV」那一层易错胶水，
# 且自带增量规则（同一组件同一 CVE 不重复阻断）与 XLSX 报告。
#
# 为什么**不**配 failOnSeverity（＝不设门禁）：
# 镜像发布链路上卡一个第三方 CVE，等于用漏洞换可用性 —— 紧急修复会被自己堵死。
# 所以扫描失败也照常发镜像，只在日志里列出全部漏洞，由人（或 NPC）当天跟进。
# 要转成强门禁：加一行 failOnSeverity: high 即可（须同时接上「当天修完」的值班承诺）。
#
# 触发条件：只在依赖指纹变更时跑，避免改文档也扫一遍。
.sca-vuln: &sca-vuln
  name: 开源组件漏洞扫描
  runner:
    tags: cnb:arch:amd64
    cpus: 2
  git:
    lfs: false
    submodules: false
  allowFailure: true
  stages:
    - name: 扫描（全量）
      image: cnbcool/sca-vulnerability:latest
      timeout: 20m
      settings:
        scanMode: full
        publish: true

# ---- 构建配置 ----
master:
  push:
    # 漏洞扫描排在镜像之前：它不阻塞发布（allowFailure），但能保证「有洞必有记录」。
    # 顺带一提，它让每次依赖变动都留一份 SCA 报告附件，事后回溯不用再猜。
    - <<: *sca-vuln
      ifModify:
        - pom.xml
        - '**/pom.xml'
        - astral-front/package.json
        - astral-front/package-lock.json
        - astral-blog/package.json
        - astral-blog/pnpm-lock.yaml
        - .cnb.yml

    # ifNewBranch: 首次把 master 推上 CNB 时属于新分支，ifModify 没有比对基准，
    # 用它保证首次推送必定全量构建；之后每次 push 走 ifModify 路径过滤。
    - name: backend 镜像
      <<: *docker-pipeline
      lock:
        key: backend-image
        cancel-in-progress: true
      ifNewBranch: true
      ifModify:
        - pom.xml
        - .mvn/**
        - astral-common/**
        - astral-schema/**
        - astral-dao/**
        - astral-log/**
        - astral-auth/**
        - astral-system/**
        - astral-monitor/**
        - astral-sequence/**
        - astral-plugin-api/**
        - astral-plugin/**
        - astral-server/**
        - .cnb.yml
      stages: *backend-stages

    - name: frontend 镜像
      <<: *docker-pipeline
      lock:
        key: frontend-image
        cancel-in-progress: true
      ifNewBranch: true
      ifModify:
        - astral-front/**
        - .cnb.yml
      stages: *frontend-stages

    - name: blog 镜像
      <<: *docker-pipeline
      lock:
        key: blog-image
        cancel-in-progress: true
      ifNewBranch: true
      ifModify:
        - astral-blog/**
        - .cnb.yml
      stages: *blog-stages

  # 手动触发（master 分支详情页按钮，见 .cnb/web_trigger.yml）：
  # 全量重建，不做路径过滤。web_trigger 事件没有文件变更基准，
  # ifModify 在该事件下本来就不生效，这里干脆不写。
  web_trigger_publish:
    - name: backend 镜像（手动全量）
      <<: *docker-pipeline
      lock:
        key: backend-image
        cancel-in-progress: true
      stages: *backend-stages

    - name: frontend 镜像（手动全量）
      <<: *docker-pipeline
      lock:
        key: frontend-image
        cancel-in-progress: true
      stages: *frontend-stages

    - name: blog 镜像（手动全量）
      <<: *docker-pipeline
      lock:
        key: blog-image
        cancel-in-progress: true
      stages: *blog-stages
