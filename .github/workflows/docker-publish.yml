# ============================================
# CI：把后端 / 前端构建成镜像并推送到【腾讯云 TCR 个人版】
#
# 镜像地址形如：ccr.ccs.tencentyun.com/tcb-100008754513-winj/astral-backend:<tag>
#
# 为什么不用 ghcr.io：国内服务器拉 ghcr.io 慢且易断（实测首次 pull 15 分钟未完成）。
# 腾讯云 TCR 与服务器同区，可走内网地址拉取，快且免公网流量。
#
# 【首次使用前必须做两件事】
#   1) 在 GitHub 仓库 Settings → Secrets and variables → Actions → Secrets 添加：
#        TCR_USERNAME  —— 腾讯云控制台「容器镜像服务 → 个人版 → 访问凭证」里的登录用户名
#                         （一般是腾讯云账号 UIN 或子账号，以控制台给出的 docker login 指令为准）
#        TCR_PASSWORD  —— 同一页面设置/查看的固定密码
#      直达链接：https://github.com/barry130/astral/settings/secrets/actions
#   2) 确认命名空间 tcb-100008754513-winj 下存在两个镜像仓库：
#        astral-backend、astral-frontend
#      （TCR 个人版通常在推送时自动创建；若报 repository not found，去控制台手动新建同名仓库）
#
# 未配置 Secrets 时本 workflow 不会报红：只打一条 warning 并跳过推送，配置好后重跑即可。
#
# 服务器侧拉取：见 deploy/update.sh 与 DEPLOY_GUIDE.md「CI 构建 + 服务器 pull 更新」。
# ============================================
name: docker-publish

on:
  push:
    branches: [master]
    # 只在影响镜像内容的路径变化时构建，避免改文档/说明也跑一遍 CI
    paths:
      - 'pom.xml'
      - '.mvn/**'
      - 'astral-*/**' # 覆盖 astral-server/**、astral-front/** 等全部模块
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch: # 支持手动触发（首次验证请用这个，不要靠 push 试错）

# 同一分支只保留最后一次构建，省 Actions 分钟数（本仓库是 public，分钟数不限，但避免排队）
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_HOST: ccr.ccs.tencentyun.com
  # 命名空间路径（不含具体仓库名），必须与服务器 deploy/.env 里的 REGISTRY 保持一致
  IMAGE_PREFIX: ccr.ccs.tencentyun.com/tcb-100008754513-winj

jobs:
  # ---------- 生成一个「日期 + 短 SHA」的发布 tag，供回滚使用 ----------
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: echo "tag=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # ==================== 后端 ====================
  backend:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 凭证未配置时不报红：打一条 warning 直接跳过，配置好 Secrets 后重跑即可
      - id: creds
        env:
          U: ${{ secrets.TCR_USERNAME }}
          P: ${{ secrets.TCR_PASSWORD }}
        run: |
          if [ -n "$U" ] && [ -n "$P" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TCR_USERNAME / TCR_PASSWORD 未配置，本次跳过构建与推送。配置后重跑本 workflow 即可。"
          fi

      - if: steps.creds.outputs.ok == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.creds.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - if: steps.creds.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: . # 仓库根：Dockerfile 依赖根 pom + .mvn + 各模块 pom
          file: astral-server/Dockerfile
          push: true
          # 服务器若是 ARM(aarch64) 架构：改成 platforms: linux/arm64
          # 需要同时支持两种架构：platforms: linux/amd64,linux/arm64
          # platforms: linux/amd64
          provenance: false # 关掉 attestation，避免仓库里出现 unknown/unknown 平台条目
          tags: |
            ${{ env.IMAGE_PREFIX }}/astral-backend:latest
            ${{ env.IMAGE_PREFIX }}/astral-backend:${{ needs.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  # ==================== 前端 ====================
  frontend:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: creds
        env:
          U: ${{ secrets.TCR_USERNAME }}
          P: ${{ secrets.TCR_PASSWORD }}
        run: |
          if [ -n "$U" ] && [ -n "$P" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TCR_USERNAME / TCR_PASSWORD 未配置，本次跳过构建与推送。配置后重跑本 workflow 即可。"
          fi

      - if: steps.creds.outputs.ok == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.creds.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - if: steps.creds.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: astral-front
          file: astral-front/Dockerfile
          push: true
          provenance: false
          # ⚠️ 构建期参数必须在 CI 里定义：服务器改成「只 pull 不 build」后，
          #    deploy/docker-compose.yml 里的 build.args 不再生效。
          #    NEXT_PUBLIC_API_URL 建议留空（走同源 /api + Next rewrites）；
          #    如需设置，到 Settings → Secrets and variables → Actions → Variables 新建同名变量。
          build-args: |
            BACKEND_URL=http://backend:27000
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/astral-frontend:latest
            ${{ env.IMAGE_PREFIX }}/astral-frontend:${{ needs.meta.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
