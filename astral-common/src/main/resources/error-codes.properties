# ============================================
# Astral 错误码定义
# 格式: 模块前缀 + 3位数字
# AUTH: 认证模块 (AUTH001-AUTH099)
# SYS: 系统管理模块 (SYS001-SYS099)
# SEQ: 序列模块 (SEQ001-SEQ099)
# LOG: 日志模块 (LOG001-LOG099)
# MON: 监控模块 (MON001-MON099)
# COMMON: 通用错误 (COMMON001-COMMON099)
# ============================================

# 通用错误
COMMON001=系统繁忙，请稍后再试
COMMON002=参数校验失败: {0}
COMMON003=数据不存在
COMMON004=缺少请求参数: {0}
COMMON005=权限不足
COMMON006=上传文件过大，请压缩后重试
COMMON007=请求过于频繁，请稍后再试

# 认证模块
AUTH001=用户未登录
AUTH002=用户名或密码错误
AUTH003=账户已被锁定，请15分钟后再试
AUTH004=密码解密失败
AUTH005=Token已失效
AUTH006=账户已被禁用
AUTH007=验证码错误
AUTH008=登录尝试次数过多，请60秒后再试
AUTH010=需要动态验证码（TOTP）
AUTH011=动态验证码错误
AUTH012=密码强度不足
AUTH013=请求校验失败，请刷新页面后重试

# 系统管理模块
SYS001=用户不存在
SYS002=用户名已存在
SYS003=角色不存在
SYS004=角色已存在
SYS005=权限不存在
SYS006=该权限已被{0}个角色关联，无法删除
SYS007=字典类型不存在
SYS008=配置项不存在
SYS009=表结构不存在
SYS010=表名不能为空
SYS011=表已存在: {0}
SYS012=关联的角色或权限不存在: {0}
SYS013=菜单不存在
SYS014=父菜单不存在: {0}
SYS015=父菜单设置非法: {0}

CLUSTER001=集群未启用或当前节点未注册
CLUSTER002=节点不存在

# 序列模块
SEQ001=序列配置不存在
SEQ002=序列类型不支持
SEQ003=业务键已存在，无法重复创建
SEQ004=序列生成失败
SEQ005=号段分配失败
SEQ006=业务键'{0}'已绑定序列类型'{1}'，不允许切换为'{2}'
SEQ007=配置不存在
SEQ008=系统内置序列{0}由系统自动维护，不允许修改或删除

# 日志模块
LOG001=日志记录失败
LOG002=日志查询失败

# 监控模块
MON001=监控数据获取失败

# 插件模块
PLUGIN001=插件{0}已被禁用，接口不可用
PLUGIN002=系统内置插件{0}不允许禁用

# 邮件模块
MAIL001=邮件账户不存在或未启用
MAIL002=邮件模板不存在: {0}
MAIL003=插件未获得发信授权: {0}
MAIL004=该插件当日发送额度已用完，请明日再试
MAIL005=邮件发送失败: {0}
MAIL006=该插件无此邮件场景权限: {0}
MAIL007=授权码不能为空字符串；不修改请直接省略该字段
MAIL008=模板编码已存在: {0}
MAIL009=未知的通知事件: {0}（事件码需在 NotifyEventRegistry 中登记）
MAIL010=模板缺少场景必需变量: {0}
MAIL011=该插件已存在发信授权: {0}
MAIL012=未知的发信场景: {0}
MAIL013=该场景已绑定其他模板: {0}，请直接编辑原模板或先解绑
MAIL014=收件邮箱不能为空
MAIL015=模板编码不能为空
MAIL016=邮件场景不能为空
MAIL017=插件ID不能为空
MAIL018=插件{0}的发信授权未配置允许场景，已拒绝发送（fail-closed）
MAIL019=未知的通知渠道: {0}
MAIL020=通知渠道不能为空
MAIL021=事件 {0} 不支持渠道 {1}

# 短信通知（notify SMS 渠道：供应商池 + 供应商侧模板映射）
SMS001=短信供应商不存在或未启用
SMS002=短信模板不存在: {0}
SMS003=短信发送失败: {0}
SMS004=手机号不能为空
SMS005=短信每日额度已用完
SMS006=未知的短信供应商类型: {0}
SMS007=短信模板编码已存在: {0}
SMS008=该事件已绑定其他短信模板: {0}
SMS009=短信模板缺少事件参数: {0}
SMS010=短信供应商名称已存在: {0}
SMS011=短信供应商类型不能为空
SMS012=短信供应商名称不能为空
SMS013=短信模板编码不能为空
SMS014=短信模板名称或绑定事件不能为空
SMS015=供应商模板编码不能为空
SMS016=审核状态取值非法（0草稿/1审核中/2已通过/3已拒绝）

# 事件订阅规则（notify 阶段④）
NOTIFY001=订阅规则名称已存在: {0}
NOTIFY002=订阅规则不存在: {0}
NOTIFY003=订阅规则缺少模板绑定
NOTIFY004=模板与规则的事件/渠道不匹配: {0}
NOTIFY005=收件人类型非法（FIXED/PAYLOAD_FIELD）: {0}
NOTIFY006=收件人取值不能为空
NOTIFY007=收件人字段不在事件 payload 声明中: {0}
NOTIFY008=订阅规则名称不能为空
NOTIFY009=事件码不能为空
NOTIFY010=平台定向取值非法: {0}（可选 all/app-android/app-ios/app-windows/app-linux/app-macos/app-harmony/web）

# 站内信（notify INAPP 渠道）
INAPP001=站内信不存在: {0}

# 存储模块（storage 插件）
STORAGE001=文件存储插件未启用
STORAGE002=存储配置不存在或已禁用
STORAGE003=存储连接测试失败: {0}
STORAGE004=默认存储未配置
STORAGE005=文件类型不允许: {0}
STORAGE006=文件大小超过限制
STORAGE007=请求过于频繁，请稍后再试
STORAGE008=上传凭证无效或已过期
STORAGE009=远端对象校验失败
STORAGE010=下载地址生成失败
STORAGE011=上传回调被拒绝: {0}
STORAGE012=远端删除失败，已进入重试
STORAGE013=无文件夹或文件访问权限
STORAGE014=调用主体未授权
STORAGE015=Scope 不足: {0}
STORAGE016=文件不存在或当前不可用
STORAGE017=Worker 请求认证无效或已过期
STORAGE018=插件、配置或授权已禁用
STORAGE019=Provider 不支持该能力: {0}
STORAGE020=Endpoint 不安全或不在白名单
STORAGE021=文件已删除
STORAGE022=签名校验失败
STORAGE023=签名 URL 已过期
STORAGE024=存储凭证未配置或无法解密
STORAGE025=文件夹不存在或已停用
STORAGE026=Telegram 渠道限流，请稍后再试
STORAGE027=上传结果未知，请联系管理员核对
STORAGE028=文件夹名称已存在
STORAGE029=上传策略配置非法: {0}
STORAGE030=文件超出该文件夹的大小限制
STORAGE031=文件类型不被该文件夹允许: {0}
STORAGE032=今日上传次数已达上限
STORAGE033=文件内容校验未通过: {0}
