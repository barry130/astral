# ============================================
# Astral 错误码定义
# 格式: 模块前缀 + 3位数字
# AUTH: 认证模块 (AUTH001-AUTH099)
# SYS: 系统管理模块 (SYS001-SYS099)
# SEQ: 序列模块 (SEQ001-SEQ099)
# LOG: 日志模块 (LOG001-LOG099)
# MON: 监控模块 (MON001-MON099)
# COMMON: 通用错误 (COMMON001-COMMON099)
# ============================================

# 通用错误
COMMON001=系统繁忙，请稍后再试
COMMON002=参数校验失败: {0}
COMMON003=数据不存在
COMMON004=缺少请求参数: {0}
COMMON005=权限不足

# 认证模块
AUTH001=用户未登录
AUTH002=用户名或密码错误
AUTH003=账户已被锁定，请15分钟后再试
AUTH004=密码解密失败
AUTH005=Token已失效
AUTH006=账户已被禁用
AUTH007=验证码错误
AUTH008=登录尝试次数过多，请60秒后再试

# 系统管理模块
SYS001=用户不存在
SYS002=用户名已存在
SYS003=角色不存在
SYS004=角色已存在
SYS005=权限不存在
SYS006=该权限已被{0}个角色关联，无法删除
SYS007=字典类型不存在
SYS008=配置项不存在
SYS009=表结构不存在
SYS010=表名不能为空
SYS011=表已存在: {0}

CLUSTER001=集群未启用或当前节点未注册
CLUSTER002=节点不存在

# 序列模块
SEQ001=序列配置不存在
SEQ002=序列类型不支持
SEQ003=业务键已存在，无法重复创建
SEQ004=序列生成失败
SEQ005=号段分配失败
SEQ006=业务键'{0}'已绑定序列类型'{1}'，不允许切换为'{2}'
SEQ007=配置不存在
SEQ008=系统内置序列{0}由系统自动维护，不允许修改或删除

# 日志模块
LOG001=日志记录失败
LOG002=日志查询失败

# 监控模块
MON001=监控数据获取失败

# 插件模块
PLUGIN001=插件{0}已被禁用，接口不可用
PLUGIN002=系统内置插件{0}不允许禁用

# 邮件模块
MAIL001=邮件账户不存在或未启用
MAIL002=邮件模板不存在: {0}
MAIL003=插件未获得发信授权: {0}
MAIL004=该插件当日发送额度已用完，请明日再试
MAIL005=邮件发送失败: {0}
MAIL006=该插件无此邮件场景权限: {0}
