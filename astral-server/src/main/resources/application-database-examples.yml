# 当前运行时只支持 PostgreSQL。复制到 application-local.yml 或使用环境变量覆盖。
# 仓库中的 H2/MySQL 驱动及历史多方言脚本用于测试/历史工具，不构成生产迁移兼容保证。
# 不存在 astral.database.* 覆盖数据源的机制；唯一数据源配置入口是 spring.datasource.*。
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/astral?currentSchema=astral}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: astral
    schemas: astral
    placeholder-replacement: false
    # 存量库基线策略与 application.yml 一致；首次部署请阅读 db/migration/README.md。
    baseline-on-migrate: true
    baseline-version: 20260914001

# SQL 日志需临时排查时仅对具体 Mapper 配置 DEBUG，不启用 StdOutImpl。
logging:
  level:
    root: INFO
    com.astral: INFO
