# ============================================
# 生产环境配置（1核 / 2GiB / 1Mbps 腾讯云学生机针对性优化）
# 通过 SPRING_PROFILES_ACTIVE=prod 激活；docker-compose 引用本文件作为启动参数。
# 测试/本地环境不激活本 profile，保持默认 application.yml，不受影响。
#
# 优化要点（仅 prod）：
#   1. 虚拟线程（JDK 25）：Tomcat 请求线程 + @Async 异步池 → 降低平台线程内存占用，
#      支撑高并发"等待中"请求（I/O 密集）
#   2. 线程参数：Tomcat max-threads=40, Hikari pool=5（1核2G 上避免过度配）
#   3. 日志降级：mybatis NoLoggingImpl + com.astral=INFO（单核上避免每 SQL stdout 开销）
# ============================================

server:
  port: ${SERVER_PORT:27000}
  tomcat:
    # 1 核 CPU：40 工作线程足够，减少平台线程栈内存
    threads:
      max: ${TOMCAT_MAX_THREADS:40}
      min-spare: ${TOMCAT_MIN_SPARE:5}
    accept-count: ${TOMCAT_ACCEPT_COUNT:50}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:500}

spring:
  threads:
    virtual:
      # JDK 25 虚拟线程：Tomcat 请求线程池改虚拟线程（生产开启）
      enabled: true

  datasource:
    driver-class-name: org.postgresql.Driver
    # 默认值与运行环境一致，可用环境变量覆盖
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/astral?currentSchema=astral}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # 1核2G：连接池压到 5（DB 并发上限），避免过度占用内存
      minimum-idle: ${HIKARI_MIN_IDLE:3}
      maximum-pool-size: ${HIKARI_MAX_POOL:5}
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:7}

# 序列生成器
astral:
  threads:
    virtual:
      # @Async(sequenceAsyncExecutor) 异步池改用 JDK 25 虚拟线程（生产开启）
      enabled: true

  auth:
    # 生产走 HTTPS（deploy/ 下的 Caddy / nginx 终结 TLS），认证 Cookie 必须带 Secure，
    # 否则明文链路下 Cookie 可被中间人截获，HttpOnly 的意义也就没了。
    # 若生产确实是纯 http 内网裸跑，把它显式改成 false，否则登录后 Cookie 不会落地。
    cookie-secure: ${AUTH_COOKIE_SECURE:true}

# ---------------- 生产环境「默认收敛」的暴露面 ----------------
# 鉴权拦截器只覆盖 /api/**，而 nginx 把整个站点域都反代到本服务：
# /actuator/**、/v3/api-docs、/swagger-ui.html 因此完全绕过鉴权 ── 匿名即可读取
# JVM/DB/Redis 指标与全部接口清单，等于给攻击者一份完整踩点地图。
# 下面把默认值收紧到「只留健康检查」，需要排障时用环境变量临时放开。
management:
  endpoints:
    web:
      exposure:
        # 只暴露 health（docker healthcheck 依赖）；metrics/prometheus 需要时显式加
        include: ${ACTUATOR_ENDPOINTS:health}
  endpoint:
    health:
      # 匿名端点不回组件细节（DB/Redis 连接串、磁盘路径都属内部信息）
      show-details: ${ACTUATOR_HEALTH_DETAILS:never}

springdoc:
  # 生产默认关闭 OpenAPI 文档；本地/测试不受影响（本文件仅 prod profile 生效）
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

mybatis-plus:
  configuration:
    # 生产静默 SQL 日志：每条 SQL + 参数打印到 stdout 在单核上是无谓开销
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: INFO
    com.astral: INFO
  file:
    name: ${LOG_FILE:/app/logs/application.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
