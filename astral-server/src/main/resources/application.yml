server:
  port: 27000
  servlet:
    context-path: /

spring:
  application:
    name: astral

  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:7}

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/astral?currentSchema=astral}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  # 数据库迁移（Flyway）：启动时自动按版本号顺序应用 db/migration/V*.sql，
  # 版本历史记录在 flyway_schema_history 表（取代旧的手工 schema_migrations）。
  # - 全新空库：从 V20260914001__init.sql 全量建表 + 种子数据
  # - 存量库（表已存在但无 flyway_schema_history）：baseline-on-migrate 自动打基线，
  #   基线版本 = 20260914001，即初始化脚本被跳过不执行（其内容历史上已手工应用），
  #   仅执行编号更大的增量脚本
  # - 应急关闭：FLYWAY_ENABLED=false（仅排查问题时用，正常部署必须开启）
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    default-schema: astral
    schemas: astral
    baseline-on-migrate: true
    baseline-version: 20260914001
    baseline-description: "存量库基线：原手工 V1-V4 已应用，跳过初始化脚本"

  # 数据库结构/种子数据不走 spring.sql.init（由上面的 Flyway 接管）。
  sql:
    init:
      mode: never

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

  threads:
    virtual:
      # JDK 21 虚拟线程：Tomcat 请求线程池改虚拟线程（默认开启）
      enabled: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

astral:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

  auth:
    # token 自动续期阈值（秒）：剩余有效期低于该值时，任何携带有效 satoken 的请求都会把有效期
    # 续满 sa-token.timeout（滑动续期，活跃用户不掉线）。0 = 关闭自动续期
    token-renew-threshold: 86400

  plugins:
    enabled: true
    qt:
      enabled: ${QT_PLUGIN_ENABLED:true}
    feedback:
      enabled: ${FEEDBACK_PLUGIN_ENABLED:true}
    storage:
      enabled: ${STORAGE_PLUGIN_ENABLED:true}
      # 单文件上限（字节）：公共 Bot API 下载上限 20MiB，超过将无法再次下载
      max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE:20971520}
      # 上传凭证有效期（秒），签发给 Cloudflare Worker 的短时上传授权
      upload-ticket-ttl-seconds: 600
      # 下载签名 URL 有效期（秒），公开/私有统一 300s（MVP 撤销窗口 = TTL）
      download-url-ttl-seconds: 300
      # Worker HMAC 时间戳窗口（秒）与重放保护
      origin-timestamp-window-seconds: 300
      # 允许的 MIME 白名单：留空 = 不限制文件类型（文件管理上传不再限定类型）；如需收紧，填逗号分隔的 MIME 列表
      allowed-mime-types: ${STORAGE_ALLOWED_MIME_TYPES:}
      # 上传/下载 HMAC 密钥：仅通过环境变量注入，禁止写入本文件或仓库
      upload-ticket-key: ${STORAGE_UPLOAD_TICKET_KEY:}
      origin-shared-secret: ${STORAGE_ORIGIN_SHARED_SECRET:}
      download-signing-key: ${STORAGE_DOWNLOAD_SIGNING_KEY_V1:}

  sequence:
    default-type: segment
    default-step: 1000

  # 全端统计
  stat:
    enabled: ${STAT_ENABLED:true}
    error-retention-days: 90
    hourly-retention-days: 180

sa-token:
  token-name: satoken
  timeout: 259200
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-header: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.astral.dao.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.astral: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId:-}] %-5level %logger{36} - %msg%n"