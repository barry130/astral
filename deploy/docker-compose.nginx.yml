# ============================================================
# overlay：套在 nginx 反向代理前面时使用（端口只绑回环，不直接对外）
#
# 用法（与基础文件、镜像 overlay 叠加）：
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.registry.yml \
#                  -f docker-compose.nginx.yml up -d
#
# 为什么要这层：
#   没有 nginx 时三个服务直接对外暴露（3000 / 27000 / 3001），
#   一旦前面加了 nginx 做 TLS 与限流，这些端口就该收回回环，
#   否则攻击者可以绕过 nginx 直接打后端（跳过限流、拿到明文 HTTP）。
#
# 注意：
#   - backend 内部的 healthcheck 用 localhost，绑回环不受影响
#   - 绑定 127.0.0.1 后，宿主机之外无法直连；如仍需临时调试，
#     用 ssh -L 隧道而不是改这里
# ============================================================

services:
  backend:
    ports:
      - "127.0.0.1:27000:27000"

  frontend:
    ports:
      - "127.0.0.1:3000:3000"

  blog:
    ports:
      - "127.0.0.1:3001:3000"
