version: '3.8'

# ============================================
# Astral 管理后台 部署编排 (后端 + 前端)
# PostgreSQL/Redis 复用服务器上已有的实例(裸机/已有容器), 不在此编排
# ============================================
# 使用方式(在 deploy/ 目录下):
#   构建+启动:  docker compose up -d --build
#   停止:       docker compose down
#   查看日志:   docker compose logs -f backend
#   重新构建:   docker compose build backend
#   不要加 --no-cache：Dockerfile 用了 BuildKit cache mount 缓存 Maven/npm 依赖，
#   --no-cache 会迫使每次重下全部 jar/包，把构建重新拖到十几分钟。
# ============================================

services:
  # ==================== 后端 ====================
  backend:
    build:
      context: ..
      dockerfile: astral-server/Dockerfile
      # 构建阶段走宿主机网络，避免 bridge NAT 拖慢 Maven 下载（Linux 部署机收益最大）
      network: host
    container_name: astral-backend
    restart: unless-stopped
    # 只绑回环：前面一定有 nginx（宝塔面板 nginx 或 deploy/nginx/ 那套容器 nginx）。
    # 不要把这里改成 0.0.0.0 / 纯 "27000:27000" —— 那等于把后端裸奔在公网。
    # 若确实要直接对外（裸机试跑），改成 "0.0.0.0:27000:27000" 并在安全组放开。
    ports:
      - "127.0.0.1:27000:27000"
    # 生产 JVM 参数 + SPRING_PROFILES_ACTIVE=prod（虚拟线程/线程参数/日志降级）
    # 仅在启动 backend 时加载 prod.env；测试环境不引用此文件
    env_file:
      - prod.env
    environment:
      # ---- 数据库与 Redis（复用服务器已有实例）----
      # 全部取自 deploy/.env（已 gitignore），复制 .env.example 为 .env 后填写；
      # 未填写时 compose 直接报错，避免用占位值静默启动。
      SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL:?请在 deploy/.env 设置数据库连接串}"
      SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME:?请在 deploy/.env 设置数据库账号}"
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:?请在 deploy/.env 设置数据库密码}"
      REDIS_HOST: "${REDIS_HOST:?请在 deploy/.env 设置 Redis 地址}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请在 deploy/.env 设置 Redis 密码}"
      REDIS_DB: "${REDIS_DB:-7}"
      # ---- 插件 ----
      QT_PLUGIN_ENABLED: "true"
      # ---- 文件存储插件 HMAC 密钥（Worker 通道）----
      # 取自 deploy/.env；留空则不启用文件存储链路。与 Worker Secret 必须一致（STORAGE017）
      STORAGE_UPLOAD_TICKET_KEY: "${STORAGE_UPLOAD_TICKET_KEY:-}"
      STORAGE_ORIGIN_SHARED_SECRET: "${STORAGE_ORIGIN_SHARED_SECRET:-}"
      STORAGE_DOWNLOAD_SIGNING_KEY_V1: "${STORAGE_DOWNLOAD_SIGNING_KEY_V1:-}"
      # ---- AI 插件密钥加密主密钥（KEK）----
      # ai_provider.encrypted_api_key 的 AES-256-GCM 解密口令。必须与「保存提供方密钥时」
      # 所用值逐字一致——换了值（或没配）旧密文全部解不开，报 AI006「提供方密钥无法解密」。
      # 只能通过 deploy/.env 注入，绝不写进版本库；一旦使用不要随意更换。
      ASTRAL_AI_SECRET_KEY: "${ASTRAL_AI_SECRET_KEY:-}"
      # ---- 时区 ----
      TZ: Asia/Shanghai
      # ---- CORS 跨域白名单（当前生产为「跨域直连」形态：web.canace.cn 直连 astral.canace.cn）----
      # 后端默认只放行 http://localhost:3000（2026-09-28 由 * 收紧：allowCredentials=true 下
      # 通配等于对任意站点开放带凭据跨域）。生产必须在 deploy/.env 显式列出全部前端域名，
      # 漏一个该域名登录即报「无法连接到服务器」（OPTIONS 预检 403 Invalid CORS request）。
      # 注意：compose 只透传 environment: 里引用到的变量——只写 .env 不写这里不生效（踩过）。
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000}"
    # Linux 下让容器可通过 host.docker.internal 访问宿主机上的 PostgreSQL/Redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 持久化 RSA 密钥对 (命名卷自动继承镜像内 /app/data 的属主, 避免非 root 写权限问题)
      - backend-data:/app/data
      - backend-logs:/app/logs
    networks:
      - astral-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:27000/actuator/health"]
      # start_period 内的失败不计入判定：冷启动要跑 Flyway 迁移 + Spring 全量装配，
      # 1核2G 机器实测 ~60-90s。此前无 start_period + interval 30s 会在 ~90s 误判 unhealthy，
      # 依赖 service_healthy 的 frontend 因此停在 Created 状态（每次部署「报错但过一会成功」）。
      start_period: 300s
      interval: 15s
      timeout: 5s
      retries: 3

  # ==================== 前端 ====================
  frontend:
    build:
      context: ../astral-front
      dockerfile: Dockerfile
      network: host
      args:
        # 构建期 BACKEND_URL 只影响 next build 时 rewrites 的字面量占位；
        # 真正生效的是 environment.BACKEND_URL（容器内 proxy.js 启动时读取）。
        BACKEND_URL: http://backend:27000
    container_name: astral-frontend
    restart: unless-stopped
    # 只绑回环，理由同 backend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # 后端地址：容器内 proxy.js 把 /api/** 转发到这里（启动时读取，改后重启即可，无需重建镜像）。
      # 独立部署换后端：只改这个变量，不用重新 build。
      BACKEND_URL: http://backend:27000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - astral-net

  # ==================== 博客前台 (公开站点) ====================
  # www.canace.cn 站点本体：公开博客 + Wiki，数据全部来自 backend 的
  # /api/v1/app/cms/** 公开接口（服务端 RSC fetch，浏览器不跨域）。
  blog:
    build:
      context: ../astral-blog
      dockerfile: Dockerfile
      network: host
      args:
        # 构建期不请求后端（页面全 force-dynamic），这里只为保持一致；
        # 真正生效的是下面 environment 里的运行时值。
        CMS_API_BASE: http://backend:27000
    container_name: astral-blog
    restart: unless-stopped
    ports:
      # 宿主机 3001 -> 容器 3000（容器内由 PORT=3000 决定，不经过 package.json 的 -p 3001）
      # 只绑回环，理由同 backend
      - "127.0.0.1:3001:3000"
    environment:
      # 后端容器地址：博客所有数据都从它取（含转发登录态读写 /api/v1/admin/cms/**）
      CMS_API_BASE: http://backend:27000
      NODE_ENV: production
      TZ: Asia/Shanghai
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - astral-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  astral-net:
    driver: bridge

volumes:
  backend-data:
  backend-logs:
