# ============================================================
# astral 统一入口反代示例（部署收敛：后端不出网，全端打同一个域名）
#
# 目标形态（替代现行「web.canace.cn 前端直连 astral.canace.cn 后端」的跨域形态）：
#   公网 443 ──→ 本机 nginx（TLS 终结 / 限流 / 日志）
#                 ├─ /api/**   → 127.0.0.1:27000（Spring Boot，仅监听内网/回环）
#                 └─ /         → 127.0.0.1:3000（astral-front standalone / Next start）
#
# 迁移要点：
# 1. 后端只监听回环：docker-compose 里后端 ports 改为 "127.0.0.1:27000:27000"，
#    或直接删掉 ports 由 nginx 走容器网络。
# 2. 同源后 CORS 不再需要：CORS_ALLOWED_ORIGINS 可留默认（仅 dev 用），
#    注意 deploy/.env 里旧的生产值要同步清掉，避免残留误解。
# 3. X-Forwarded-For 取真实 IP：后端 ClientIp 默认信任回环+私网段，nginx 在同机
#    即满足可信代理条件，无需额外配置；若 nginx 与后端跨机，把 nginx 机器 IP 加入
#    astral.web.trusted-proxies。
# 4. 轻听 App（qt-uniappx）与 qt-pc 的 API 地址统一改打这个域名（https）。
#    App 的 cleartext 流量放行可在迁移完成后从基座移除（需重打基座）。
# 5. 会话模型已改为 is-share:false：全端会话重置执行一次
#    PUT /api/v1/admin/system/token/revoke-all（超管），让存量 token 进入新模型。
# ============================================================

# HTTP → HTTPS
server {
    listen 80;
    server_name qt.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name qt.example.com;

    # 证书路径按实际调整（或用 certbot --nginx 自动接管本文件）
    ssl_certificate     /etc/nginx/ssl/qt.example.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/qt.example.com.key;

    # 统一登录防爆破的流量级兜底（后端已有 @RateLimit 应用层限流，这里是网络层保险）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # ---- 后端 API ----
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://127.0.0.1:27000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        client_max_body_size 20m;   # 头像/封面直传回执走 /api，本地兜底上传路径也给足余量
    }

    # ---- 管理端前端（Next.js standalone，端口按实际部署调整）----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js HMR / 资源长连接兜底（生产可去）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
