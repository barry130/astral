events {
    worker_connections 1024;
}

http {
    upstream sequence_backend {
        least_conn;  # 使用最少连接算法
        
        server sequence-node-1:8080 max_fails=3 fail_timeout=30s;
        server sequence-node-2:8080 max_fails=3 fail_timeout=30s;
        server sequence-node-3:8080 max_fails=3 fail_timeout=30s;
        
        keepalive 32;  # 保持长连接
    }
    
    server {
        listen 8080;
        server_name localhost;
        
        # 日志配置
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
        
        # 客户端配置
        client_max_body_size 10M;
        client_body_timeout 120s;
        client_header_timeout 60s;
        
        # 代理配置
        location / {
            proxy_pass http://sequence_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 禁用缓存
            proxy_cache off;
            
            # 超时配置
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            
            # 健康检查相关
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }
        
        # 健康检查端点
        location /actuator/health {
            proxy_pass http://sequence_backend/actuator/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        
        # API文档
        location /swagger-ui.html {
            proxy_pass http://sequence_backend/swagger-ui.html;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        
        location /v3/api-docs {
            proxy_pass http://sequence_backend/v3/api-docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
