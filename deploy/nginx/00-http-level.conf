# ============================================================
# nginx http 级公共配置（限流区 / WebSocket 升级映射）
#
# 这两个指令只能出现在 http {} 块里，不能写进 server {}，
# 所以单独成文件，由 nginx.conf 的 http 块 include 进来。
#
# 放置位置（Ubuntu/Debian 官方包）：
#   /etc/nginx/conf.d/00-astral-http.conf
# 并确认 /etc/nginx/nginx.conf 的 http {} 里有：
#   include /etc/nginx/conf.d/*.conf;
# ============================================================

# 登录/评论等接口的网络层兜底限流（后端已有 @RateLimit 应用层限流，这里是第二道闸）
# 30r/s 对单用户足够宽松，主要拦暴力扫描与异常刷量。
limit_req_zone $binary_remote_addr zone=astral_api:10m rate=30r/s;

# 评论提交单独收紧一档：博客的匿名评论接口
limit_req_zone $binary_remote_addr zone=astral_comment:10m rate=2r/s;

# Next.js 生产环境其实不用 WebSocket，但保留映射是标准写法：
# 有 Upgrade 头才置 "upgrade"，否则置空，避免污染普通请求的长连接。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 反代到上游时统一的真实 IP / 协议头
# （后端 ClientIp 默认信任回环与私网段，nginx 与容器同机即可拿到真实 IP）
