# ============================================================
# nginx http 级公共配置（限流区 / WebSocket 升级映射）
#
# 这两个指令只能出现在 http {} 块里，不能写进 server {}，
# 所以单独成文件，由 nginx.conf 的 http 块 include 进来。
#
# 放置位置（Ubuntu/Debian 官方包）：
#   /etc/nginx/conf.d/00-astral-http.conf
# 并确认 /etc/nginx/nginx.conf 的 http {} 里有：
#   include /etc/nginx/conf.d/*.conf;
# ============================================================

# 登录/评论等接口的网络层兜底限流（后端已有 @RateLimit 应用层限流，这里是第二道闸）
# 30r/s 对单用户足够宽松，主要拦暴力扫描与异常刷量。
limit_req_zone $binary_remote_addr zone=astral_api:10m rate=30r/s;

# 评论提交单独收紧一档：博客的匿名评论接口
limit_req_zone $binary_remote_addr zone=astral_comment:10m rate=2r/s;

# Next.js 生产环境其实不用 WebSocket，但保留映射是标准写法：
# 有 Upgrade 头才置 "upgrade"，否则置空，避免污染普通请求的长连接。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 反代到上游时统一的真实 IP / 协议头
# （后端 ClientIp 默认信任回环与私网段，nginx 与容器同机即可拿到真实 IP）


# ============================================================
# 安全响应头（http 级默认值，各 server 可按需覆盖）
#
# 为什么集中在这里：过去三个站点一个 add_header 都没有 —— 历史版本的管理台把
# 登录令牌放在 localStorage，任意一处前端缺陷（如曾被修掉的头像存储型 XSS）
# 都能把长效凭据整份导走。响应头不能替代代码修复，但它是「缺陷 → 灾难」之间
# 最便宜的一道墙，且对所有站点一次性生效。
#
#   - Strict-Transport-Security：强制 HTTPS，杜绝 SSL Strip；includeSubDomains 覆盖
#     三个子域（web/astral/www），本机无其它需走 http 的子域。
#   - X-Content-Type-Options: nosniff：禁止浏览器猜类型（上传 HTML 冒充图片的放大器）。
#   - X-Frame-Options / frame-ancestors：禁止被第三方站点内嵌（点击劫持）。
#   - Referrer-Policy：跨站只送 origin，签名 URL / 分享链接不会被 Referer 带出去。
#   - Permissions-Policy：显式关掉本站不用的设备能力。
#
# 注意：nginx 的 add_header 继承是「全有或全无」——只要某个 location 里写了
# 一条 add_header，父级的全部 add_header 就不再对那个 location 生效。
# 站点文件里自带 add_header 的 location（/_next/static 的 Cache-Control）
# 已显式 include 本文件，避免静态资源反而丢掉安全头。
# ============================================================
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
