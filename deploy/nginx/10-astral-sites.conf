# ============================================================
# Astral 三个站点的反向代理
#
#   https://www.canace.cn      → 127.0.0.1:3001  astral-blog 容器（博客前台，公开站点）
#   https://www.canace.cn/api/ → 127.0.0.1:3001  ★同上，博客自己的 Route Handler
#   https://web.canace.cn      → 127.0.0.1:3000  astral-frontend 容器（管理端）
#   https://astral.canace.cn   → 127.0.0.1:27000 后端 API（跨域直连形态，与现网一致）
#
# ── 为什么 www 域名下的 /api 必须交给博客容器 ──
#   博客自己有这些 Next Route Handler：
#     /api/auth/login、/api/auth/logout、/api/auth/session
#     /api/comment
#     /api/admin/meta、/api/admin/post/[id]、/api/admin/page/[id]
#     /api/admin/export/[...path]
#   它们在服务端把 satoken / astral_csrf 转发给后端并回写 Set-Cookie。
#   若把这些 /api 反代到 27000，登录、评论、页内保存、导出会全部 404。
#   博客取数据全在服务端（CMS_API_BASE=http://backend:27000），
#   浏览器端不需要访问后端 /api。
#
# ── 管理端形态（2026-10 同源化改造后）──
#   前端镜像已通用化：bundle 内 API_BASE_URL 为空串（同源相对路径 /api），
#   容器内 proxy.js 按启动时 BACKEND_URL 把 /api/** 转发到后端，
#   web.canace.cn 的 /api/ location 一并反代到前端容器。换后端域名只改
#   compose 的 BACKEND_URL 环境变量，不再需要重新构建镜像。
#   canace.cn 的子域之间 SameSite=Strict 仍算同站，Cookie 可正常携带。
#
# ── 放置位置（Ubuntu/Debian）──
#   /etc/nginx/conf.d/10-astral-sites.conf
#   并先把 00-http-level.conf 放到 /etc/nginx/conf.d/00-astral-http.conf，
#   供 nginx.conf 的 http {} 块 include。
#
# ── nginx 版本要求 ──
#   `http2 on;` 需要 nginx >= 1.25.1。更旧的版本把每个 443 块里的
#       listen 443 ssl;
#       http2 on;
#   合并回老写法
#       listen 443 ssl http2;
# ============================================================


# ============================================================
# 一、博客前台：www.canace.cn（裸域 canace.cn 一并跳过来）
# ============================================================

server {
    listen 80;
    server_name www.canace.cn canace.cn;

    # certbot webroot 校验通道
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://www.canace.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.canace.cn canace.cn;

    ssl_certificate     /etc/nginx/ssl/www.canace.cn.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/www.canace.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 博客只收评论与页内编辑，正文图片走 CDN，8m 足够
    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    access_log /var/log/nginx/www.canace.cn.access.log;
    error_log  /var/log/nginx/www.canace.cn.error.log warn;

    # 匿名评论：单独收紧限流（后端另有 @RateLimit 应用层限流做第二道）
    location = /api/comment {
        limit_req zone=astral_comment burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 其余 /api：博客自己的 Route Handler（登录、会话、页内读写、导出）
    location /api/ {
        limit_req zone=astral_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # 导出是文件流（ZIP / Markdown），缓冲会把整包顶进内存
        proxy_buffering off;
    }

    # Next.js 构建产物带内容哈希，可长缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 子级一旦出现 add_header，父级安全头就全部失效 → 这里必须补回
        include /etc/nginx/snippets/astral-security-headers.conf;
    }

    # 页面
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }
}


# ============================================================
# 二、管理端：web.canace.cn（astral-frontend 容器）
#     接口另走 astral.canace.cn，见第三节
# ============================================================

server {
    listen 80;
    server_name web.canace.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://web.canace.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name web.canace.cn;

    ssl_certificate     /etc/nginx/ssl/web.canace.cn.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/web.canace.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 管理端有封面图/头像上传
    client_max_body_size 20m;

    access_log /var/log/nginx/web.canace.cn.access.log;
    error_log  /var/log/nginx/web.canace.cn.error.log warn;

    # ── 服务端代传上传：raw body 直连后端 27000，不经 Next 容器代理 ──
    # 设计 §14.2：PUT 正文必须保持流式，request buffering 会把整张图先落 nginx 临时文件；
    # Next 的 proxy.js 也会改写分块/缓冲行为。1m 与应用侧 1MiB 上限一致（JSON 意图另由应用限 8KiB）。
    # 注意：本 location 不继承兄弟 location 的转发头与安全头，需要就用 include 显式带回。
    # astral.canace.cn 的 server 内必须保留同一段，两处同步维护。
    location ^~ /api/v1/all/storage/upload-operations {
        limit_req zone=astral_api burst=10 nodelay;
        client_max_body_size 5m;
        client_body_timeout 20s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:27000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 代理超时是空闲超时；90 秒总 deadline 由应用自己实现
        proxy_read_timeout 110s;
        proxy_send_timeout 110s;
    }

    # /api/ 由前端容器内置的 proxy.js 转发到后端（BACKEND_URL，容器内网 backend:27000）。
    # 也可以在这里直接反代 127.0.0.1:27000，但走容器内代理可让「nginx 配置」与
    # 「镜像的 BACKEND_URL」保持单一事实来源；独立部署没有 nginx 时同样能跑。
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 同上：补回父级安全头
        include /etc/nginx/snippets/astral-security-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }
}


# ============================================================
# 三、后端 API：astral.canace.cn（跨域直连形态的接口域）
# ============================================================

server {
    listen 80;
    server_name astral.canace.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://astral.canace.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name astral.canace.cn;

    ssl_certificate     /etc/nginx/ssl/astral.canace.cn.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/astral.canace.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    access_log /var/log/nginx/astral.canace.cn.access.log;
    error_log  /var/log/nginx/astral.canace.cn.error.log warn;

    # ── 服务端代传上传：与 web.canace.cn 的专用 location 完全一致 ──
    # 跨域直连形态下客户端本就打 astral.canace.cn，这里只为让 raw-body 上传
    # 关掉 nginx 请求缓冲并获得比普通 API 更长的空闲超时；CORS 仍只由后端处理。
    location ^~ /api/v1/all/storage/upload-operations {
        limit_req zone=astral_api burst=10 nodelay;
        client_max_body_size 5m;
        client_body_timeout 20s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:27000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 110s;
        proxy_send_timeout 110s;
    }

    # CORS 由后端 spring 处理（CORS_ALLOWED_ORIGINS），nginx 不重复添加，
    # 否则会出现两份 Access-Control-Allow-Origin 导致浏览器判定失败。
    location / {
        limit_req zone=astral_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:27000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }
}
